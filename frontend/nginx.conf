server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;

  location = /runtime-config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /relay/testnet/ {
    set $relay_testnet event-relay-testnet:8080;
    rewrite ^/relay/testnet/(.*)$ /$1 break;
    proxy_pass http://$relay_testnet;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /relay/mainnet/ {
    set $relay_mainnet event-relay-mainnet:8080;
    rewrite ^/relay/mainnet/(.*)$ /$1 break;
    proxy_pass http://$relay_mainnet;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
