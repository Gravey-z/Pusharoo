@if (retention && retention.status !== 'protected') {
  <div
    class="retention-warning"
    (pointerenter)="showFromPointer($event)"
    (pointerleave)="hideFromPointer($event)"
    (focusout)="hideFromFocus()"
  >
    <button
      type="button"
      class="retention-warning-trigger"
      [attr.aria-label]="'Retention information for ' + projectName"
      [attr.aria-describedby]="tooltipOpen ? tooltipId : null"
      [attr.aria-expanded]="tooltipOpen"
      (focus)="showFromFocus($event)"
      (click)="toggleTooltip()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M10.3 4.8a2 2 0 0 1 3.4 0l7 12A2 2 0 0 1 19 20H5a2 2 0 0 1-1.7-3.2l7-12Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path d="M12 9v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="12" cy="16.5" r="1" fill="currentColor" />
      </svg>
    </button>
    @if (tooltipOpen) {
      <div class="retention-tooltip" [id]="tooltipId" role="tooltip">
        <div class="retention-tooltip-surface">
          <app-project-retention-notice [retention]="retention" />
        </div>
      </div>
    }
  </div>
}
