@if (!isEmbeddedInWorkspace) {
  <nav class="release-nav" aria-label="Project release workspace">
    <div class="release-tabs">
      <a
        #releaseTab
        [routerLink]="['/projects', projectId]"
        routerLinkActive="active"
        #overviewLink="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-current]="overviewLink.isActive ? 'page' : null"
        (keydown)="onReleaseTabKeydown($event)"
        >Contracts</a
      >
      <a
        #releaseTab
        [routerLink]="['/projects', projectId, 'authorized-deployers']"
        routerLinkActive="active"
        #authorizedDeployersLink="routerLinkActive"
        [attr.aria-current]="authorizedDeployersLink.isActive ? 'page' : null"
        (keydown)="onReleaseTabKeydown($event)"
        >Authorized deployers</a
      >
      <a
        #releaseTab
        [routerLink]="['/projects', projectId, 'webhooks']"
        routerLinkActive="active"
        #webhooksLink="routerLinkActive"
        [attr.aria-current]="webhooksLink.isActive ? 'page' : null"
        (keydown)="onReleaseTabKeydown($event)"
        >Webhooks</a
      >
    </div>
    <span class="wallet-context" [class.mainnet]="wallet.session()?.network === 'neo3:mainnet'">
      {{ wallet.shortAddress() || 'Wallet not connected' }} ·
      {{ wallet.networkLabel(wallet.session()?.network) }}
    </span>
  </nav>
}
