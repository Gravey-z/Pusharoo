<div class="app-shell" [class.workspace-embedded]="isEmbeddedInWorkspace">
  <header class="topbar">
    <a routerLink="/projects" class="brand" aria-label="Pusharoo projects">
      <img src="pusharoo-logo.png?v=20260824-192" alt="Pusharoo" />
    </a>
    <div class="topbar-actions">
      <nav aria-label="Main navigation">
        <a routerLink="/projects">Projects</a>
      </nav>
      <app-wallet-connect />
    </div>
  </header>

  <main class="page">
    <div class="page-heading">
      <div class="page-heading-content">
        @if (breadcrumbs.length) {
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            @for (breadcrumb of breadcrumbs; track $index) {
              @if ($index) {
                <span class="breadcrumb-separator" aria-hidden="true">/</span>
              }
              @if (breadcrumb.link) {
                <a [routerLink]="breadcrumb.link">{{ breadcrumb.label }}</a>
              } @else {
                <span aria-current="page">{{ breadcrumb.label }}</span>
              }
            }
          </nav>
        }
        <h1>{{ title }}</h1>
      </div>
      <ng-content select="[actions]" />
    </div>
    <ng-content />
  </main>
</div>
