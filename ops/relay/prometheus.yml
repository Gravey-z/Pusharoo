global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/relay-alerts.yml
scrape_configs:
  - job_name: pusharoo-event-relay
    static_configs:
      - targets: ['event-relay-testnet:8080', 'event-relay-mainnet:8080']
# Configure Alertmanager here in your private deployment to send notifications.
