services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Networks__testnet__Endpoint: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      NeoRpc__Networks__testnet__ContractManagementHash: ${PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      NeoRpc__Networks__mainnet__Endpoint: ${PUSHAROO_MAINNET_RPC_URL:-https://mainnet1.neo.coz.io:443}
      NeoRpc__Networks__mainnet__ContractManagementHash: ${PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
    expose:
      - "8080"
    depends_on:
      - mongo

  event-relay:
    build:
      context: ./event-relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Endpoint: ${PUSHAROO_RELAY_RPC_URL:-https://mainnet1.neo.coz.io:443}
      NeoRpc__Network: ${PUSHAROO_RELAY_NETWORK:-neo3:mainnet}
      NeoRpc__PollIntervalSeconds: ${PUSHAROO_RELAY_POLL_INTERVAL_SECONDS:-15}
      NeoRpc__MaxBlocksPerPoll: ${PUSHAROO_RELAY_MAX_BLOCKS_PER_POLL:-10}
      PusharooApi__Endpoint: http://api:8080
      DataProtection__KeyRingPath: /var/lib/pusharoo/data-protection
    expose:
      - "8080"
    depends_on:
      - mongo
      - api
    volumes:
      - event-relay-data:/var/lib/pusharoo/data-protection

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUSHAROO_API_BASE_URL: /api
      PUSHAROO_EVENT_RELAY_BASE_URL: /relay/api
      PUSHAROO_EVENT_RELAY_HEALTH_URL: /relay/health
      PUSHAROO_DEFAULT_NETWORK: ${PUSHAROO_DEFAULT_NETWORK:-neo3:testnet}
      PUSHAROO_WALLETCONNECT_PROJECT_ID: ${PUSHAROO_WALLETCONNECT_PROJECT_ID}
      PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH: ${PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH: ${PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      PUSHAROO_TESTNET_RPC_URL: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      PUSHAROO_MAINNET_RPC_URL: ${PUSHAROO_MAINNET_RPC_URL:-https://mainnet1.neo.coz.io:443}
    depends_on:
      - api
      - event-relay
    ports:
      - "${PUSHAROO_HTTP_PORT:-8080}:80"

  mongo:
    image: mongo:8.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  event-relay-data:
