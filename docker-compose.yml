services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Networks__testnet__Endpoint: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      NeoRpc__Networks__testnet__ContractManagementHash: ${PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      NeoRpc__Networks__mainnet__Endpoint: ${PUSHAROO_MAINNET_RPC_URL:-https://mainnet1.neo.coz.io:443}
      NeoRpc__Networks__mainnet__ContractManagementHash: ${PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      WalletSignatures__Audience: ${PUSHAROO_WALLET_SIGNATURE_AUDIENCE:-pusharoo-web}
      WalletSignatures__AllowedOrigins__0: ${PUSHAROO_APP_ORIGIN:-http://localhost:8080}
      WalletAuth__PublicOrigin: ${PUSHAROO_APP_ORIGIN:-http://localhost:8080}
      WalletAuth__AllowInsecureLocalhost: ${PUSHAROO_AUTH_ALLOW_HTTP_LOCALHOST:-true}
      WalletAuth__ChallengeLifetimeMinutes: ${PUSHAROO_AUTH_CHALLENGE_MINUTES:-5}
      WalletAuth__SessionLifetimeHours: ${PUSHAROO_AUTH_SESSION_HOURS:-8}
      WalletAuth__DataProtectionKeyRingPath: /var/lib/pusharoo/data-protection
      WalletAuth__TrustedProxyAddresses__0: ${PUSHAROO_AUTH_TRUSTED_PROXY_IP:-}
      RelayGateway__Testnet__Endpoint: http://event-relay-testnet:8080
      RelayGateway__Testnet__ServiceToken: ${PUSHAROO_RELAY_TESTNET_SERVICE_TOKEN:-}
      RelayGateway__Mainnet__Endpoint: http://event-relay-mainnet:8080
      RelayGateway__Mainnet__ServiceToken: ${PUSHAROO_RELAY_MAINNET_SERVICE_TOKEN:-}
      Faucet__ContractHash: ${PUSHAROO_TESTNET_FAUCET_CONTRACT_HASH:-}
      Faucet__NetworkMagic: 894710606
      Faucet__TrustedProxyAddresses__0: ${PUSHAROO_FAUCET_TRUSTED_PROXY_IP:-}
      Faucet__TrustedProxyNetworks__0: ${PUSHAROO_FAUCET_TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
      FaucetRelayer__Enabled: "false"
      FaucetRelayer__KeyConfigured: ${PUSHAROO_FAUCET_RELAYER_WIF:+true}
      FaucetRelayer__MaximumTransactionFeeGas: ${PUSHAROO_FAUCET_MAX_TRANSACTION_FEE_GAS:-0.5}
      FaucetRelayer__DailyFeeBudgetGas: ${PUSHAROO_FAUCET_DAILY_FEE_BUDGET_GAS:-5}
    expose:
      - "8080"
    volumes:
      - api-data-protection:/var/lib/pusharoo/data-protection
    depends_on:
      - mongo

  faucet-relayer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8081
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Networks__testnet__Endpoint: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      Faucet__ContractHash: ${PUSHAROO_TESTNET_FAUCET_CONTRACT_HASH:-}
      Faucet__NetworkMagic: 894710606
      FaucetRelayer__Enabled: "true"
      FaucetRelayer__PrivateKeyWif: ${PUSHAROO_FAUCET_RELAYER_WIF:-}
      FaucetRelayer__MaximumTransactionFeeGas: ${PUSHAROO_FAUCET_MAX_TRANSACTION_FEE_GAS:-0.5}
      FaucetRelayer__DailyFeeBudgetGas: ${PUSHAROO_FAUCET_DAILY_FEE_BUDGET_GAS:-5}
      FaucetRelayer__PollIntervalSeconds: 3
      FaucetRelayer__ProtocolSettings__Network: 894710606
      FaucetRelayer__ProtocolSettings__AddressVersion: 53
    depends_on:
      - mongo

  event-relay-testnet:
    profiles:
      - event-relay
    build:
      context: .
      dockerfile: event-relay/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Endpoint: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      NeoRpc__FallbackEndpoint: ${PUSHAROO_TESTNET_FALLBACK_RPC_URL:-}
      NeoRpc__Network: neo3:testnet
      NeoRpc__StartAtLatest: ${PUSHAROO_RELAY_START_AT_LATEST:-true}
      NeoRpc__PollIntervalSeconds: ${PUSHAROO_RELAY_POLL_INTERVAL_SECONDS:-15}
      NeoRpc__MaxBlocksPerPoll: ${PUSHAROO_RELAY_MAX_BLOCKS_PER_POLL:-10}
      EventRelay__ScannerStallSeconds: ${PUSHAROO_RELAY_SCANNER_STALL_SECONDS:-120}
      EventRelay__DeliveryWorkerStallSeconds: ${PUSHAROO_RELAY_WORKER_STALL_SECONDS:-120}
      EventRelay__MaxScannerLagBlocks: ${PUSHAROO_RELAY_MAX_SCANNER_LAG_BLOCKS:-30}
      EventRelay__MaxQueueDepth: ${PUSHAROO_RELAY_MAX_QUEUE_DEPTH:-1000}
      PusharooApi__ServiceToken: ${PUSHAROO_RELAY_TESTNET_SERVICE_TOKEN:-}
      DataProtection__KeyRingPath: /var/lib/pusharoo/data-protection
    expose:
      - "8080"
    depends_on:
      - mongo
      - api
    volumes:
      - event-relay-testnet-data:/var/lib/pusharoo/data-protection

  event-relay-mainnet:
    profiles:
      - event-relay
    build:
      context: .
      dockerfile: event-relay/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-Pusharoo}
      NeoRpc__Endpoint: ${PUSHAROO_MAINNET_RPC_URL:-https://mainnet1.neo.coz.io:443}
      NeoRpc__FallbackEndpoint: ${PUSHAROO_MAINNET_FALLBACK_RPC_URL:-}
      NeoRpc__Network: neo3:mainnet
      NeoRpc__StartAtLatest: ${PUSHAROO_RELAY_START_AT_LATEST:-true}
      NeoRpc__PollIntervalSeconds: ${PUSHAROO_RELAY_POLL_INTERVAL_SECONDS:-15}
      NeoRpc__MaxBlocksPerPoll: ${PUSHAROO_RELAY_MAX_BLOCKS_PER_POLL:-10}
      EventRelay__ScannerStallSeconds: ${PUSHAROO_RELAY_SCANNER_STALL_SECONDS:-120}
      EventRelay__DeliveryWorkerStallSeconds: ${PUSHAROO_RELAY_WORKER_STALL_SECONDS:-120}
      EventRelay__MaxScannerLagBlocks: ${PUSHAROO_RELAY_MAX_SCANNER_LAG_BLOCKS:-30}
      EventRelay__MaxQueueDepth: ${PUSHAROO_RELAY_MAX_QUEUE_DEPTH:-1000}
      EventRelay__PaymentRecipientAddress: ${EVENT_RELAY_PAYMENT_RECIPIENT_ADDRESS:-}
      EventRelay__PaidPlanGasDatoshis: ${EVENT_RELAY_PAID_PLAN_GAS_DATOSHIS:-500000000}
      EventRelay__PaidPlanDays: ${EVENT_RELAY_PAID_PLAN_DAYS:-30}
      EventRelay__PaidGraceDays: ${EVENT_RELAY_PAID_GRACE_DAYS:-3}
      EventRelay__PaidMaxActiveSubscriptions: ${EVENT_RELAY_PAID_MAX_ACTIVE_SUBSCRIPTIONS:-5}
      EventRelay__PaidMaxEvents: ${EVENT_RELAY_PAID_MAX_EVENTS:-10000}
      EventRelay__PaymentIntentMinutes: ${EVENT_RELAY_PAYMENT_INTENT_MINUTES:-15}
      EventRelay__PaymentConfirmationBlocks: ${EVENT_RELAY_PAYMENT_CONFIRMATION_BLOCKS:-2}
      PusharooApi__ServiceToken: ${PUSHAROO_RELAY_MAINNET_SERVICE_TOKEN:-}
      DataProtection__KeyRingPath: /var/lib/pusharoo/data-protection
    expose: ["8080"]
    depends_on: [mongo, api]
    volumes:
      - event-relay-mainnet-data:/var/lib/pusharoo/data-protection

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUSHAROO_API_BASE_URL: /api
      PUSHAROO_WALLET_SIGNATURE_AUDIENCE: ${PUSHAROO_WALLET_SIGNATURE_AUDIENCE:-pusharoo-web}
      PUSHAROO_TESTNET_EVENT_RELAY_HEALTH_URL: /relay/testnet/health
      PUSHAROO_MAINNET_EVENT_RELAY_HEALTH_URL: /relay/mainnet/health
      PUSHAROO_DEFAULT_NETWORK: ${PUSHAROO_DEFAULT_NETWORK:-neo3:testnet}
      PUSHAROO_WALLETCONNECT_PROJECT_ID: ${PUSHAROO_WALLETCONNECT_PROJECT_ID}
      PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH: ${PUSHAROO_TESTNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH: ${PUSHAROO_MAINNET_CONTRACT_MANAGEMENT_HASH:-0xfffdc93764dbaddd97c48f252a53ea4643faa3fd}
      PUSHAROO_TESTNET_FAUCET_CONTRACT_HASH: ${PUSHAROO_TESTNET_FAUCET_CONTRACT_HASH:-}
      PUSHAROO_TESTNET_RPC_URL: ${PUSHAROO_TESTNET_RPC_URL:-https://testnet1.neo.coz.io:443}
      PUSHAROO_MAINNET_RPC_URL: ${PUSHAROO_MAINNET_RPC_URL:-https://mainnet1.neo.coz.io:443}
    depends_on:
      api:
        condition: service_started
      event-relay-testnet:
        condition: service_started
        required: false
      event-relay-mainnet:
        condition: service_started
        required: false
    ports:
      - "${PUSHAROO_HTTP_PORT:-8080}:80"

  mongo:
    image: mongo:8.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  api-data-protection:
  event-relay-testnet-data:
  event-relay-mainnet-data:
